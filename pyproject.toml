[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-intel-agent"
version = "0.1.0"
description = "Portable competitor intelligence loop agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
]

[project.scripts]
competitor-agent = "competitor_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["competitor_agent"]

[tool.coverage.report]
fail_under = 85
show_missing = true

